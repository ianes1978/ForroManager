# Deploy su Cloudflare: backend (Worker + migrazioni D1) e app web servita dallo stesso Worker.
# Si avvia a mano da Actions: ogni deploy modifica l'account Cloudflare.
#
# Secret del repository: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PASSWORD_PEPPER
# Variabile del repository: D1_DATABASE_ID (dal workflow "Cloudflare - preparazione")
name: Cloudflare - deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlla la configurazione
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$PASSWORD_PEPPER" ] || missing="$missing PASSWORD_PEPPER"
          [ -n "$D1_DATABASE_ID" ] || missing="$missing D1_DATABASE_ID(variabile)"
          if [ -n "$missing" ]; then echo "::error::Mancano:$missing (vedi README, sezione Deploy)"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Test del backend
        working-directory: api
        run: |
          npm ci
          npm run typecheck
          npm test

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Build dell'app web
        working-directory: app
        run: |
          flutter pub get
          flutter test
          # Nessun API_BASE_URL: l'app web usa la stessa origine del Worker.
          flutter build web --release --no-web-resources-cdn
          cp -r build/web/. ../api/public/

      - name: Imposta l'id del database
        working-directory: api
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${D1_DATABASE_ID}/" wrangler.jsonc

      - name: Applica le migrazioni al database remoto
        working-directory: api
        run: npx wrangler d1 migrations apply forromanager-db --remote

      - name: Deploy del Worker
        working-directory: api
        env:
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/secrets.json"
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ PASSWORD_PEPPER: process.env.PASSWORD_PEPPER }))' "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$secrets_file"
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          {
            echo "### Deploy completato"
            echo ""
            echo "Indirizzo: $url"
            echo ""
            echo "Per l'APK imposta la variabile del repository **API_BASE_URL** = \`$url\`"
          } >> "$GITHUB_STEP_SUMMARY"
