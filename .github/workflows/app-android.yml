# Test dell'app e build dell'APK Android a ogni push che tocca /app (o a mano).
# L'APK viene pubblicato come pre-release del repository, scaricabile dal telefono.
#
# Variabile del repository: API_BASE_URL (indirizzo del Worker, dal deploy).
# Secret facoltativi per una firma stabile (consigliati: senza, ogni APK usa una
# chiave diversa e per aggiornare bisogna disinstallare):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: App - APK Android

on:
  push:
    paths: ["app/**", ".github/workflows/app-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Chiave di firma (se configurata)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Nessuna chiave di firma configurata: APK firmato con chiave di debug."
          fi

      - name: Build dell'APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Imposta la variabile del repository API_BASE_URL (indirizzo del Worker dopo il deploy)."
            exit 1
          fi
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL" --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/forromanager-${{ github.run_number }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: forromanager-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/forromanager-${{ github.run_number }}.apk
          retention-days: 30

      - name: Pubblica come pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" "$RUNNER_TEMP/forromanager-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "ForroManager APK ${{ github.run_number }}" \
            --notes "APK di prova generato dal commit ${{ github.sha }} (ramo ${{ github.ref_name }})."
          echo "### APK pronto" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/apk-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
